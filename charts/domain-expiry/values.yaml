image:
  repository: ghcr.io/anroots/domain-expiry
  # Defaults to the chart's appVersion.
  tag: "0.1.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# One replica: the result cache is in memory, so more replicas mean more WHOIS lookups.
replicaCount: 1

# Exporter settings, passed as DOMAIN_EXPIRY_* environment variables.
config:
  cacheTtlSeconds: 43200
  failureTtlSeconds: 900
  cacheMaxEntries: 10000
  lookupTimeoutSeconds: 20
  logLevel: INFO

extraEnv: []

service:
  type: ClusterIP
  port: 9019

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus Operator Probe resource (monitoring.coreos.com/v1) that scrapes
# /probe for each Domain below. Requires the Prometheus Operator CRDs.
probe:
  enabled: false
  # The cache makes shorter intervals cheap, but an Expiry changes rarely.
  interval: 1h
  # The exporter uses this (minus 0.5s) as its WHOIS lookup budget, capped at
  # config.lookupTimeoutSeconds.
  scrapeTimeout: 15s
  # Registrable domains only, e.g. example.com, not www.example.com.
  domains: []
  # Extra labels added to every target.
  labels: {}
  # Extra labels on the Probe object, e.g. to match a Prometheus probeSelector.
  additionalLabels: {}
